<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% if demo and seo %}{{ seo.title }}{% else %}Happy Birthday{% if partner_name %} - {{ partner_name }}{% endif %}{% endif %}</title>
  {% if demo and seo %}{% with seo_title=seo.title, seo_desc=seo.desc, seo_path=seo.path %}{% include '_seo.html' %}{% endwith %}
  {% else %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Itim&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='themes/doodle/doodle.css') }}">
</head>
<body class="dd{% if design %} dd-design{% endif %}">
  <div id="stage" class="stage"></div>
  <div id="dim" class="dim"></div>
  <div id="fx" class="fx"></div>
  <div id="hint" class="hint"></div>
  <div id="ui"></div>
  {% if demo %}{% include '_demo_nav.html' %}{% endif %}
  <script>
    window.DD = {
      board: {{ board|tojson }},
      photos: {{ photos|map(attribute='src')|list|tojson }},
      letter: { name: {{ partner_name|tojson }}, text: {{ letter_text|tojson }}, sign: {{ letter_sign|tojson }} },
      demo: {{ 'true' if demo else 'false' }},
      design: {{ (design or none)|tojson }},
      owner: {{ ({'slug': toolbar.slug, 'price': toolbar.price, 'package': toolbar.package} if toolbar else none)|tojson }},
      banner: {{ (banner if (banner and not demo) else none)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='themes/doodle/doodle.js') }}"></script>
</body>
</html>
