<style>
.demo-nav { position: fixed; left: 10px; top: 10px; z-index: 99997; display: flex; gap: 8px; }
.dn-btn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 11px; border-radius: 999px; color: #fff; text-decoration: none;
  font: 500 13px/1 "IBM Plex Sans Thai", "Prompt", system-ui, sans-serif; background: rgba(12,8,16,.78); border: 1px solid rgba(255,255,255,.3);

.dn-btn:active { transform: scale(.95); }

<script>
(function () {
  var b = document.getElementById('dnBack');
  if (b) b.addEventListener('click', function (e) {
    var ref = document.referrer, same = false;
    try { same = ref && new URL(ref).origin === location.origin; } catch (x) {}
    if (same && history.length > 1) { e.preventDefault(); history.back(); }
  });
})();
</script>
